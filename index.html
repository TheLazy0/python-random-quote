<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elif'e</title>
  <style>
    :root {
      --bg1: #ffe4ec;
      --bg2: #ffd1dc;
      --text: #4a1c2c;
      --accent: #e91e63;
      --card: rgba(255, 255, 255, 0.78);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, var(--bg1), var(--bg2));
      color: var(--text);
      overflow: hidden;
    }

    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .heart {
      position: absolute;
      color: rgba(233, 30, 99, 0.35);
      animation: floatUp linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      from { transform: translateY(10vh) scale(1); opacity: 0; }
      10% { opacity: 1; }
      to { transform: translateY(-110vh) scale(1.3); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(92vw, 760px);
      padding: 2rem;
      border-radius: 22px;
      background: var(--card);
      backdrop-filter: blur(4px);
      box-shadow: 0 14px 38px rgba(74, 28, 44, 0.18);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 4vw, 3rem);
      color: var(--accent);
    }

    p {
      line-height: 1.7;
      margin-top: 1.2rem;
      font-size: clamp(1rem, 2.3vw, 1.2rem);
    }

    .btn {
      margin-top: 1.6rem;
      border: none;
      border-radius: 999px;
      padding: 0.9rem 1.4rem;
      font-size: 1rem;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(233, 30, 99, 0.35);
    }

    .note {
      margin-top: 1rem;
      font-style: italic;
      opacity: 0.85;
      min-height: 1.5em;
    }
  </style>
</head>
<body>
  <div class="hearts" id="hearts"></div>

  <main class="card">
    <h1>Canım Elif 💖</h1>
    <p>
      Seninle geçen her an, hayatımın en güzel cümlesi gibi.
      Gülüşün içimi ısıtıyor, varlığın dünyamı güzelleştiriyor.
      İyi ki varsın, iyi ki benimlesin.
    </p>

    <button class="btn" id="surpriseBtn">Sürprizi Aç</button>
    <div class="note" id="note"></div>
  </main>

  <script>
    const messages = [
      "Seninle her gün yeniden aşık oluyorum. ❤️",
      "İyi ki kalbim seni seçmiş, Elif. 🌸",
      "En sevdiğim yer: senin yanın. ✨",
      "Dünyadaki en güzel tesadüfüm sensin. 💞"
    ];

    const note = document.getElementById("note");
    const btn = document.getElementById("surpriseBtn");

    btn.addEventListener("click", () => {
      const random = messages[Math.floor(Math.random() * messages.length)];
      note.textContent = random;
    });

    const hearts = document.getElementById("hearts");
    const heartChar = ["❤", "💗", "💖", "💕"];

    for (let i = 0; i < 28; i++) {
      const span = document.createElement("span");
      span.className = "heart";
      span.textContent = heartChar[Math.floor(Math.random() * heartChar.length)];
      span.style.left = `${Math.random() * 100}vw`;
      span.style.fontSize = `${12 + Math.random() * 26}px`;
      span.style.animationDuration = `${6 + Math.random() * 8}s`;
      span.style.animationDelay = `${Math.random() * 6}s`;
      hearts.appendChild(span);
    }
  </script>
</body>
</html>
